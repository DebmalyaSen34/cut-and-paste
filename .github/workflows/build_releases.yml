name: Cross Platform Standalone Build

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: [self-hosted, macOS, ARM64]
            asset_name: MediaStudio-macOS-arm64.zip
          - name: windows-x64
            platform: windows-latest
            asset_name: MediaStudio-Windows-x64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12 on Windows
        id: setup-python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          version: "latest-known"

      - name: Resolve Python Path
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python_bin="${{ steps.setup-python.outputs.python-path }}"
          else
            uv_python_dir="$RUNNER_TEMP/uv-python"
            echo "UV_PYTHON_INSTALL_DIR=$uv_python_dir" >> "$GITHUB_ENV"
            export UV_PYTHON_INSTALL_DIR="$uv_python_dir"
            uv python install 3.12
            python_bin="$(uv python find 3.12)"
          fi
          if [[ ! -f "$python_bin" ]]; then
            echo "Python interpreter was not found at: $python_bin"
            exit 1
          fi
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
          "$python_bin" --version

      - name: Create virtual environment
        shell: bash
        run: |
          uv venv --python "$PYTHON_BIN" .venv-ci
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            venv_python="$PWD/.venv-ci/Scripts/python.exe"
          else
            venv_python="$PWD/.venv-ci/bin/python"
          fi
          echo "VENV_PYTHON=$venv_python" >> "$GITHUB_ENV"
          "$venv_python" --version

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --python "$VENV_PYTHON" . "pyinstaller>=6.5" "pytest>=8.0"

      - name: Download verified FFmpeg for Windows bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          ffmpeg_url="https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          ffmpeg_sha256="04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
          ffmpeg_zip="$RUNNER_TEMP/ffmpeg-essentials.zip"
          ffmpeg_extract_dir="$RUNNER_TEMP/ffmpeg-essentials"

          curl -L --fail --retry 3 --output "$ffmpeg_zip" "$ffmpeg_url"
          actual_sha256="$(sha256sum "$ffmpeg_zip" | awk '{print $1}')"
          actual_sha256="${actual_sha256#\\}"
          if [[ "$actual_sha256" != "$ffmpeg_sha256" ]]; then
            echo "FFmpeg checksum mismatch. Expected $ffmpeg_sha256, got $actual_sha256."
            exit 1
          fi

          powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ffmpeg_zip' -DestinationPath '$ffmpeg_extract_dir' -Force"
          ffmpeg_bin_dir="$(dirname "$(find "$ffmpeg_extract_dir" -type f -name ffmpeg.exe -print -quit)")"
          cp "$ffmpeg_bin_dir/ffmpeg.exe" bin/
          cp "$ffmpeg_bin_dir/ffprobe.exe" bin/
          test -f bin/ffmpeg.exe
          test -f bin/ffprobe.exe

      - name: Download verified FFmpeg for macOS ARM64 bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p bin
          ffmpeg_url="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64"
          ffprobe_url="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-darwin-arm64"
          ffmpeg_sha256="a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584"
          ffprobe_sha256="bb2db6f5d8cef919da12fbf592119a987202a8c060a886f3cab091f9cab90b64"

          curl -L --fail --retry 3 --output bin/ffmpeg "$ffmpeg_url"
          curl -L --fail --retry 3 --output bin/ffprobe "$ffprobe_url"

          actual_ffmpeg_sha256="$(shasum -a 256 bin/ffmpeg | awk '{print $1}')"
          actual_ffprobe_sha256="$(shasum -a 256 bin/ffprobe | awk '{print $1}')"
          if [[ "$actual_ffmpeg_sha256" != "$ffmpeg_sha256" ]]; then
            echo "macOS ffmpeg checksum mismatch. Expected $ffmpeg_sha256, got $actual_ffmpeg_sha256."
            exit 1
          fi
          if [[ "$actual_ffprobe_sha256" != "$ffprobe_sha256" ]]; then
            echo "macOS ffprobe checksum mismatch. Expected $ffprobe_sha256, got $actual_ffprobe_sha256."
            exit 1
          fi

          chmod +x bin/ffmpeg bin/ffprobe
          bin/ffmpeg -version
          bin/ffprobe -version

      - name: Run test suite
        shell: bash
        run: |
          "$VENV_PYTHON" -m pytest tests

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "No Apple signing certificate configured; build will be ad-hoc signed."
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/mediastudio-certificate.p12"
          keychain_path="$RUNNER_TEMP/mediastudio-signing.keychain-db"
          original_keychains_path="$RUNNER_TEMP/mediastudio-original-keychains.txt"
          keychain_password="$(uuidgen)"

          security list-keychains -d user > "$original_keychains_path"
          echo "$MACOS_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("${keychain//\"/}")
          done < "$original_keychains_path"
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in certificate."
            exit 1
          fi
          echo "MACOS_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "MACOS_ORIGINAL_KEYCHAINS_PATH=$original_keychains_path" >> "$GITHUB_ENV"

      - name: Build standalone application on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$VENV_PYTHON" scripts/build_app.py

      - name: Build, sign, and package macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          "$VENV_PYTHON" scripts/build_app.py

      - name: Validate packaged macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          verify_dir="$RUNNER_TEMP/mediastudio-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          ditto -x -k dist/MediaStudio-macOS.zip "$verify_dir"
          test -L "$verify_dir/MediaStudio.app/Contents/Frameworks/PySide6/Qt/lib/QtCore.framework/Versions/Current"
          codesign --verify --deep --strict --verbose=2 "$verify_dir/MediaStudio.app"
          "$verify_dir/MediaStudio.app/Contents/MacOS/MediaStudio" --help >/dev/null 2>&1 &
          smoke_pid=$!
          sleep 5
          if ! kill -0 "$smoke_pid" 2>/dev/null; then
            wait "$smoke_pid"
            exit 1
          fi
          kill "$smoke_pid"

      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "$MACOS_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH"
          fi
          if [[ -f "$MACOS_ORIGINAL_KEYCHAINS_PATH" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              original_keychains+=("${keychain//\"/}")
            done < "$MACOS_ORIGINAL_KEYCHAINS_PATH"
            security list-keychains -d user -s "${original_keychains[@]}"
          fi

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release_assets
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp dist/MediaStudio-macOS.zip "release_assets/${{ matrix.asset_name }}"
          else
            cp dist/MediaStudio-Windows.zip "release_assets/${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release_assets/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
