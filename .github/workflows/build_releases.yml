name: Build Standalone Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: MediaStudio-macOS
            asset_path: dist/MediaStudio-macOS.zip
          - os: windows-latest
            artifact_name: MediaStudio-Windows
            asset_path: dist/MediaStudio-Windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller>=6.5

      - name: Download Static FFmpeg Binaries
        run: |
          python scripts/download_ffmpeg.py

      - name: Build Standalone Executable
        run: |
          python scripts/build_app.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
