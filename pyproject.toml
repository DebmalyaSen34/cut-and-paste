[project]
name = "frame-extractor"
version = "0.1.0"
description = "Lightweight macOS desktop app for extracting and cropping video frames."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "audio_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

